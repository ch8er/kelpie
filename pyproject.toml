[project]
name = "kelpie-sre"
version = "0.0.1"
description = "Open-source SRE and throughput optimization for AI agent farms"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Kelpie contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
kelpie = "kelpie.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "types-pyyaml>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kelpie"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.importlinter]
root_package = "kelpie"

[[tool.importlinter.contracts]]
name = "Core and rules do not depend on integrations"
type = "forbidden"
source_modules = ["kelpie.core", "kelpie.rules"]
forbidden_modules = [
    "kelpie.adapters",
    "kelpie.connectors",
    "kelpie.app",
    "kelpie.server",
    "kelpie.cli",
    "kelpie.metrics",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
