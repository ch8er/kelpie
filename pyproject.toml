[project]
name = "kelpie-sre"
version = "0.0.1"
description = "Open-source SRE and throughput optimization for AI agent farms"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Kelpie contributors" }]
keywords = ["ai-agents", "agent-farm", "sre", "observability", "llm", "opentelemetry"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "opentelemetry-proto>=1.45,<2",
    "pyyaml>=6.0",
]


[project.urls]
Homepage = "https://github.com/ch8er/kelpie"
Documentation = "https://github.com/ch8er/kelpie/tree/main/docs"
Issues = "https://github.com/ch8er/kelpie/issues"
Changelog = "https://github.com/ch8er/kelpie/blob/main/CHANGELOG.md"
[project.scripts]
kelpie = "kelpie.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "types-pyyaml>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kelpie"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.importlinter]
root_package = "kelpie"

[[tool.importlinter.contracts]]
name = "Core and rules do not depend on integrations"
type = "forbidden"
source_modules = ["kelpie.core", "kelpie.rules"]
forbidden_modules = [
    "kelpie.adapters",
    "kelpie.connectors",
    "kelpie.alerts",
    "kelpie.app",
    "kelpie.server",
    "kelpie.cli",
    "kelpie.metrics",
    "kelpie.traces",
    "kelpie.report",
]

[[tool.importlinter.contracts]]
name = "Only the report run reaches the LLM client"
type = "forbidden"
source_modules = [
    "kelpie.core",
    "kelpie.rules",
    "kelpie.traces",
    "kelpie.resources",
    "kelpie.alerts",
    "kelpie.connectors",
    "kelpie.adapters",
    "kelpie.app",
    "kelpie.server",
    "kelpie.metrics",
]
forbidden_modules = ["kelpie.report.root_cause"]

[[tool.importlinter.contracts]]
name = "The farm simulator and the demo stay out of Kelpie itself"
type = "forbidden"
source_modules = [
    "kelpie.core",
    "kelpie.rules",
    "kelpie.adapters",
    "kelpie.connectors",
    "kelpie.alerts",
    "kelpie.traces",
    "kelpie.resources",
    "kelpie.report",
    "kelpie.app",
    "kelpie.server",
    "kelpie.metrics",
    "kelpie.net",
    "kelpie.remote",
    "kelpie.doctor",
    "kelpie.why",
    "kelpie.snooze",
]
forbidden_modules = ["kelpie.sim", "kelpie.demo"]

[[tool.importlinter.contracts]]
name = "Live metrics do not depend on the report (it may use an LLM)"
type = "forbidden"
source_modules = ["kelpie.metrics"]
forbidden_modules = ["kelpie.report"]
allow_indirect_imports = true  # only for typing, through kelpie.app

[[tool.importlinter.contracts]]
name = "Traces build on core only"
type = "forbidden"
source_modules = ["kelpie.traces"]
forbidden_modules = [
    "kelpie.adapters",
    "kelpie.connectors",
    "kelpie.rules",
    "kelpie.app",
    "kelpie.server",
    "kelpie.cli",
    "kelpie.metrics",
]

[[tool.importlinter.contracts]]
name = "Resources build on core only"
type = "forbidden"
source_modules = ["kelpie.resources"]
forbidden_modules = [
    "kelpie.adapters",
    "kelpie.connectors",
    "kelpie.rules",
    "kelpie.traces",
    "kelpie.app",
    "kelpie.server",
    "kelpie.cli",
    "kelpie.metrics",
]

[[tool.importlinter.contracts]]
name = "Connectors build on core only"
type = "forbidden"
source_modules = ["kelpie.connectors"]
forbidden_modules = [
    "kelpie.adapters",
    "kelpie.rules",
    "kelpie.traces",
    "kelpie.resources",
    "kelpie.app",
    "kelpie.server",
    "kelpie.cli",
    "kelpie.metrics",
]

[[tool.importlinter.contracts]]
name = "Alert delivery builds on core and the HTTP helper only"
type = "forbidden"
source_modules = ["kelpie.alerts"]
forbidden_modules = [
    "kelpie.adapters",
    "kelpie.connectors",
    "kelpie.rules",
    "kelpie.traces",
    "kelpie.resources",
    "kelpie.app",
    "kelpie.server",
    "kelpie.cli",
    "kelpie.metrics",
]

[[tool.importlinter.contracts]]
name = "Agent transport builds on core and the HTTP helper only"
type = "forbidden"
source_modules = ["kelpie.remote"]
forbidden_modules = [
    "kelpie.adapters",
    "kelpie.connectors",
    "kelpie.rules",
    "kelpie.traces",
    "kelpie.resources",
    "kelpie.alerts",
    "kelpie.app",
    "kelpie.server",
    "kelpie.cli",
    "kelpie.metrics",
    "kelpie.report",
]

[[tool.importlinter.contracts]]
name = "The HTTP helper stands alone"
type = "forbidden"
source_modules = ["kelpie.net"]
forbidden_modules = [
    "kelpie.core",
    "kelpie.adapters",
    "kelpie.connectors",
    "kelpie.rules",
    "kelpie.traces",
    "kelpie.resources",
    "kelpie.app",
    "kelpie.server",
    "kelpie.cli",
    "kelpie.metrics",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
