name: Pin base images

# Resolves the Dockerfile's base images to their multi-platform index digests where the
# registries are reachable, and opens a PR that writes them as image:tag@sha256:<digest>
# (audit L14, #336). No digest is copied by hand: scripts/pin_base_images.py asks
# `docker buildx imagetools inspect` and refuses an image whose index lacks linux/amd64 or
# linux/arm64 (the release builds both). The digests are also printed in the job summary.
# Afterwards Dependabot (docker ecosystem, .github/dependabot.yml) keeps them current.
# Runs on demand, and on main when the Dockerfile or the pinning changes; when every image
# is pinned to its current digest it changes nothing.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/pin_base_images.py
      - .github/workflows/pin-base-images.yml

permissions:
  contents: read

concurrency:
  group: pin-base-images
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write  # push the pin branch
      pull-requests: write  # open the pin PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Resolve the digests
        run: |
          python3 scripts/pin_base_images.py --write | tee pins.txt
          {
            echo '### Base image index digests'
            echo
            echo '```'
            cat pins.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/pin_base_images.py --check
      - name: Open the pin PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- Dockerfile; then
            echo "The Dockerfile is pinned to the current digests: nothing to do."
            exit 0
          fi
          branch=chore/pin-base-images
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -q -m "chore(docker): pin the base images by digest (#336)" -- Dockerfile
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          open=$(gh pr list --head "$branch" --state open --json number --jq '.[].number')
          if [ -n "$open" ]; then
            echo "PR #$open updated."
            exit 0
          fi
          body=$(printf '%s\n' \
            'Pins the Dockerfile base images by their multi-platform index digest, as resolved by the pin-base-images workflow (audit L14, #336):' \
            '' '```' "$(cat pins.txt)" '```' '' \
            'A PR opened with the workflow token does not start CI: a maintainer closes and reopens it (or pushes to it) so ci-ok runs.')
          if ! gh pr create --head "$branch" --base main \
            --title "chore(docker): pin the base images by digest (#336)" --body "$body"; then
            echo "::warning::Could not open the PR (is 'Allow GitHub Actions to create pull requests' off?). The branch $branch holds the pins; the digests are in the job summary."
          fi
