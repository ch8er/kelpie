name: CI

# Draft PRs do not build. A PR builds when it is marked ready for review and on
# every push to it afterwards; main builds on push. Docs-only changes are skipped.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    # A new build cancels the previous one for the same branch. Job-level so that
    # skipped draft runs never cancel a real build.
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Import contracts (core must not import adapters/connectors)
        run: uv run lint-imports

  test:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    # A new build cancels the previous one for the same branch. Job-level so that
    # skipped draft runs never cancel a real build.
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest --cov=kelpie --cov-report=term
      - name: Coverage gate for kelpie.rules (>= 90%)
        run: uv run coverage report --include='src/kelpie/rules/*' --fail-under=90
