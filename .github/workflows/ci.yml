name: CI

# Draft PRs do not build. A PR builds when it is marked ready for review and on every
# push to it afterwards; main builds on push. Docs-only changes skip lint and test.
# `ci-ok` is the only required check: it always reports, and fails only if a needed
# job failed or was cancelled.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# A newer run cancels the older one for the same PR branch. Workflow-level so runs are
# ordered by event; drafts get their own group so a skipped draft run never cancels a
# real build. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!**/*.md"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Import contracts (core must not import adapters/connectors)
        run: uv run lint-imports

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest --cov=kelpie --cov-report=term --ignore=tests/e2e
      - name: Coverage gate for kelpie.rules (>= 90%)
        run: uv run coverage report --include='src/kelpie/rules/*' --fail-under=90

  # Scenarios: real `kelpie serve` against a simulated Hermes farm with fake GitHub,
  # Telegram and Slack (kelpie.sim, tests/sim). A scenario fails on any ERROR line in
  # Kelpie's log.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest tests/e2e -v --basetemp=${{ runner.temp }}/e2e
      # What a visitor runs: the wheel in a fresh venv, outside the repository.
      - name: kelpie demo from the built wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv venv "$RUNNER_TEMP/demo-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/demo-venv" uv pip install "$RUNNER_TEMP"/dist/*.whl
          # A failed run keeps its farm (and log) here, where the step below uploads it.
          mkdir -p "$RUNNER_TEMP/e2e/demo"
          cd "$RUNNER_TEMP" && TMPDIR="$RUNNER_TEMP/e2e/demo" \
            timeout 120 "$RUNNER_TEMP/demo-venv/bin/kelpie" demo
      - name: Keep the scenario logs of a failed run
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/e2e/**/*.log
            ${{ runner.temp }}/e2e/**/*.jsonl
            ${{ runner.temp }}/e2e/**/*.toml
          if-no-files-found: ignore

  # macOS: the libproc process table that ends a stopped Hermes run's worker there, against
  # real processes, and its fingerprint against psutil's (what Hermes records on macOS).
  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: >-
          uv run --with psutil pytest -v
          tests/adapters/test_hermes_proctable.py
          tests/adapters/test_hermes_worker.py
          tests/adapters/test_hermes_stop.py

  ci-ok:
    needs: [changes, lint, test, e2e, macos]
    if: always() && (github.event_name == 'push' || !github.event.pull_request.draft)
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "changes=${{ needs.changes.result }} lint=${{ needs.lint.result }} test=${{ needs.test.result }} e2e=${{ needs.e2e.result }} macos=${{ needs.macos.result }}"
          exit 1
      - run: echo "CI ok"
