name: CI

# Draft PRs do not build. A PR builds when it is marked ready for review and on every
# push to it afterwards; main builds on push. Docs-only changes skip lint and test.
# `ci-ok` is the only required check: it always runs, and passes only when the head it
# reports for was built (or the change is docs-only); a draft's ci-ok fails.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

# A newer run cancels the older one for the same PR branch. Workflow-level so runs are
# ordered by event; drafts get their own group so a draft run (it runs only ci-ok, which
# fails) never cancels a real build. Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # paths-filter may fetch the base branch with git: this checkout keeps its token
      # (read-only: contents: read).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!docs/**"
              - "!**/*.md"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Import contracts (core must not import adapters/connectors)
        run: uv run lint-imports
      # The image docker-compose.yml runs, so the rules are checked by the promtool that
      # will load them.
      - name: Prometheus rules (promtool check and unit tests)
        run: >-
          docker run --rm --entrypoint /bin/sh -v "$PWD/deploy/prometheus:/rules:ro" -w /rules
          prom/prometheus:v3.5.0 -c
          'promtool check rules rules/*.yml && promtool test rules tests/*.yml'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - run: uv run pytest --cov=kelpie --cov-report=term --ignore=tests/e2e
      - name: Coverage gate for kelpie.rules (>= 90%)
        run: uv run coverage report --include='src/kelpie/rules/*' --fail-under=90

  # Scenarios: real `kelpie serve` against a simulated Hermes farm with fake GitHub,
  # Telegram and Slack (kelpie.sim, tests/sim). A scenario fails on any ERROR line in
  # Kelpie's log.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - run: uv run pytest tests/e2e -v --basetemp=${{ runner.temp }}/e2e
      # What a visitor runs: the wheel in a fresh venv, outside the repository.
      - name: kelpie demo from the built wheel
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv venv "$RUNNER_TEMP/demo-venv"
          VIRTUAL_ENV="$RUNNER_TEMP/demo-venv" uv pip install "$RUNNER_TEMP"/dist/*.whl
          # A failed run keeps its farm (and log) here, where the step below uploads it.
          mkdir -p "$RUNNER_TEMP/e2e/demo"
          cd "$RUNNER_TEMP" && TMPDIR="$RUNNER_TEMP/e2e/demo" \
            timeout 120 "$RUNNER_TEMP/demo-venv/bin/kelpie" demo
      - name: Keep the scenario logs of a failed run
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs
          path: |
            ${{ runner.temp }}/e2e/**/*.log
            ${{ runner.temp }}/e2e/**/*.jsonl
            ${{ runner.temp }}/e2e/**/*.toml
          if-no-files-found: ignore

  # macOS: the libproc process table that ends a stopped Hermes run's worker there, against
  # real processes, and its fingerprint against psutil's (what Hermes records on macOS); and
  # rule 10's stop on a two-board config; and kelpie selftest stop end to end against a fake
  # Hermes, single-board and multi-board.
  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - run: >-
          uv run --with psutil pytest -v
          tests/adapters/test_hermes_proctable.py
          tests/adapters/test_hermes_writer.py
          tests/adapters/test_hermes_worker.py
          tests/adapters/test_hermes_stop.py
          tests/adapters/test_hermes_boards_stop.py
          tests/selftest
      # Issue 320: the self-test's stop flaked here once; run it again and again to show it holds.
      # About 2 minutes of macOS time per CI run (15 passes): cut it to one pass after a month
      # of green macOS runs. With the fake's boards in WAL mode the loop cannot reproduce the
      # old race; test_a_hot_journal_fails_the_step_with_its_cause guards against it.
      - name: Self-test stop, 15 times in a row
        run: |
          for i in $(seq 1 15); do
            echo "::group::run $i"
            uv run --with psutil pytest -q \
              "tests/selftest/test_hermes_selftest.py::test_a_stop_passes_end_to_end" \
              "tests/selftest/test_hermes_selftest.py::test_a_multi_board_config_passes_through_the_boards_adapter" \
              || exit 1
            echo "::endgroup::"
          done

  # GitHub counts a skipped required check as passed, so ci-ok always runs, drafts too, and
  # passes only for the head this run built (scripts/ci_ok.py, issue 344): a draft run, a
  # run for a head the PR no longer has, or a code change whose lint, test, e2e or macos
  # job did not pass, fails. A later run for the same commit replaces a failed ci-ok.
  # Re-running a draft or stale run fails again (same event payload): mark the PR ready or
  # push. If a draft run's ci-ok finished after the ready run's, re-run the ready run's ci-ok.
  ci-ok:
    needs: [changes, lint, test, e2e, macos]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci_ok.py
          sparse-checkout-cone-mode: false
      - name: The PR's head now
        id: pr
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .head.sha)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: Pass only for a built head
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DRAFT: ${{ github.event.pull_request.draft || false }}
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_PR_HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: python3 scripts/ci_ok.py
