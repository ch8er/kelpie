# Kelpie configuration. Copy to kelpie.toml (or point --config / $KELPIE_CONFIG at it).
# Every key is optional; the values below are the defaults unless noted.

[engine]
interval = "30s"          # how often the control loop ticks
dry_run = true            # global override: when true nothing leaves Kelpie in any mode
default_mode = "observe"  # observe | suggest | act, for rules without their own mode
cooldown = "30m"          # the same action is not repeated within this window
retry_after = "5m"        # ...except after a failure, which may be retried sooner
max_actions_per_task_per_hour = 6  # actions with an effect per task (else session, rule)
once_window = "7d"        # one-off actions (WIP commit, resume note) are done once per window
once_attempts = 3         # ...and given up after this many failed attempts

# One table per rule: an optional mode plus the rule's own parameters. Names must be in
# the plan (kelpie.rules.PLANNED); unknown names stop Kelpie at startup, and planned rules
# that are not implemented yet are skipped with a warning. `kelpie status` shows the result.
#
# [engine.rules.stale_blocks]
# mode = "suggest"
# unblock_grace = "5m"
#
# [engine.rules.checkpoints]
# commit_every = "30m"      # remind a live session to commit after this long
# max_changed_files = 20    # ...or once it has more changed files than this
# wip_ci = "skip_ci"        # WIP commit on exit: "skip_ci" ([skip ci]) or "draft_pr"
# act_within = "24h"        # WIP commit and resume note only this long after the exit
#
# [engine.rules.orphan_status]
# orphan_after = "30m"      # ownerless in an owned status (in_progress) this long -> alert
# queue_after = "2h"        # ...in a hand-off queue (review, accepted)
# reviewer_roles = []       # roles that review; empty: the review stop pattern is off
# review_idle_after = "2h"  # stop pattern: review with no reviewer, session or open condition
# next_action_after = "30m" # stop pattern: a run ended with success and nothing moved the task
# dependents_not_woken = false  # also: a done task's dependents stay in backlog (opt-in)
# dead_end_chains = true    # stop pattern: a chain of waits ending in a task off the board
# max_recovery_depth = 1    # stop pattern: recovery tasks recovering recovery tasks
# recovery_labels = ["recovery"]  # labels that mark a recovery task
# recovery_titles = []      # ...or title patterns, e.g. '^recover (?P<target>T-\d+)'
# hold_labels = []          # held tasks are skipped by the stop patterns; unset: bottlenecks'
# ignore_tasks = []         # task ids or globs rule 3 never looks at (boards without labels)
#
# [engine.rules.bottlenecks]
# min_idle_time = "30m"     # an agent counts as idle this long after its last session
# idle_alert_after = "30m"  # ...and alerts once ready work it could take waited this long
# slots = 5                 # optional farm concurrency limit: full slots are not idle capacity
# human_gate_min_tasks = 3  # a human task with this many agent tasks behind it is a gate
# human_gate_after = "1h"   # ...once it has been ready (or in progress) this long
# ready_is_queued = false   # true on Hermes: assigned ready tasks nobody started are queued
#                           # work of their role, not a busy owner
# escalate_human_gates = true  # false: leave human tasks to the needs_you inbox (one
#                              # message per person instead of one per gate)
# hold_labels = []          # labels that park tasks on purpose; no expiry unless hold_expiry
# hold_expiry = "4h"        # optional: expected length of a hold without its own expires_after
# [[engine.rules.bottlenecks.holds]]   # a label that parks tasks on purpose
# label = "merge-hold"
# owner = "human-owner"     # named in the alert when the hold looks forgotten
# expires_after = "2h30m"
# ready_prs = false         # true where agents merge: open PRs GitHub says can be merged
#                           # are ready work (needs [connectors.github.pulls]); hold labels
#                           # on PRs hold them either way
# pr_role = "developer"     # optional: the role that merges PRs (default: any idle agent)
#
# [engine.rules.needs_you]
# human_wait_alert_after = "1h"  # a human task enters its owner's inbox once agent work behind
#                                # it has waited this long
# approval_wait_after = "30m"    # an agent blocked for a person's input or approval, after this
# approval_reasons = ["waiting_human", "needs_input", "approval"]  # block reason prefixes
# approvers = { ops = "human-lead" }  # agent role -> the human who answers its questions
# default_approver = "human-owner"    # otherwise this human; without either: "unassigned"
# critical_after_hours = 24      # critical once a person's agent-hours waited reach this
#
# [engine.rules.conflict_warning]
# expected_shared = ["CHANGELOG.md"]  # glob patterns of files many tasks are meant to edit
# serialize = false         # true: hold the later of two conflicting tasks (act mode, needs an
#                           # adapter that can park a task in waiting, and wait_condition in
#                           # act mode to wake it; Kelpie warns at startup otherwise)
#
# [engine.rules.dispatch_gate]
# mode = "suggest"          # act parks ready tasks (needs an adapter that can, and
#                           # wait_condition in act mode to wake them; Kelpie warns otherwise)
# max_condition_age = "15m" # only an unmet condition checked this recently gates a task
# gate_on_parents = false   # also park ready tasks with unfinished parents (for dispatchers
#                           # that ignore dependencies; hides rule 6's chain alert otherwise;
#                           # a task parked on a parent and a PR together needs a human if
#                           # the parent is cancelled)
#
# [engine.rules.no_progress]
# window = "30m"            # tokens vs. progress over this long; [traces] window must be
#                           # at least this long (Kelpie warns at startup otherwise)
# min_tokens_without_progress = 100000  # alert at this many tokens and no progress
# claim_grace = "2m"        # a status change this soon after the session start is the claim
#
# [engine.rules.loop_breaker]
# mode = "suggest"          # stop needs a platform adapter that can stop a run; until then
#                           # use observe or suggest
# identical_calls = 8       # identical consecutive tool calls (same tool + arguments)...
# identical_window = "10m"  # ...with the last ones this close together
# consecutive_errors = 5    # failed tool calls in a row...
# error_window = "10m"      # ...the last one at most this long ago...
# min_error_span = "60s"    # ...and the streak at least this long (not one parallel batch)
# stop_on_shared_budgets = false  # hard day/project budgets only alert; true also stops
# forecast_horizon = "2h"   # info alert when a budget (or a subscription limit) is this near
# poll_grace = "15m"        # polling that matches poll_patterns: rule 2 coaches first; stop
#                           # only this long after its comment, or at poll_hard_limit calls
# poll_hard_limit = 30
# [engine.rules.loop_breaker.poll_patterns]   # optional: taken from wait_condition's unless set
# ci_status = ["gh pr checks"]
# [engine.rules.loop_breaker.agents.agent-ops-1]   # per agent (owner id) ...
# identical_calls = 20
# [engine.rules.loop_breaker.roles.maintenance]    # ... or per role; agent wins
# consecutive_errors = 8

# Rule 7: disk, memory, CPU, load and process thresholds per host, and a limit on heavy
# tasks while a host is overloaded. Utilization is used / limit (load: per core). Each
# threshold can be set to false to switch it off. Readings older than max_reading_age are
# ignored. Alerts only: Kelpie suggests, a human or the dispatcher acts. Needs host
# readings: see [resources.prometheus] below.
#
# [engine.rules.resources]
# mode = "suggest"
# disk_warning = 0.85       # also disk_critical (0.95)
# memory_warning = 0.90     # also memory_critical (0.97)
# load_warning = 1.5        # load1 / cores; also load_critical (3.0)
# cpu_warning = 0.95        # off by default (load covers overload); also cpu_critical
# processes_warning = 0.80  # processes / process limit; also processes_critical (0.95). The
#                           # default query divides by pid_max (often 4 million), so this
#                           # rarely fires; set the processes_max query to a real ceiling
# heavy_label = "heavy"     # tasks with this label (or a label in heavy_labels = [...]) ...
# heavy_roles = []          # ... or in one of these roles are heavy
# max_heavy_per_host = 2    # alert when an overloaded host runs more heavy tasks at once
#                           # (default: not checked). Needs an adapter that sets Task.host
#                           # (the Hermes adapter does not yet): with several hosts and tasks
#                           # that do not say where they run, you get one alert without a host
# max_reading_age = "10m"
#
# LLM providers (readings from [connectors.llm_quotas] below, or llm_quota/auth resources):
# quota_warning = 0.1       # warn at this share of the quota left (remaining / limit)
# rate_limit_events_warning = 20  # warn at this many limit hits per provider ...
# rate_limit_window = "24h"       # ... within this long
# ignore_resets_within = "10m"    # quota windows refilling this soon are not reported
# auth_expiry_warning = "72h"     # warn this long before a credential expires
#                                 # (expired or rejected keys are critical)
# provider_roles = { provider-main = ["coder", "reviewer"] }  # who uses which provider:
# provider_owners = { provider-b = ["agent-writer-1"] }        # by task/owner role or owner id.
#   An exhausted quota is critical when ready or running agent tasks use the provider
#   (listed as blocked_tasks). Without a mapping Kelpie does not guess which tasks use a
#   provider: the alert stays a warning and lists no tasks.
#
# Rule 9 (CI economy): CI builds that burned minutes for nothing (superseded, repeated for
# a verified commit, docs-only, drafts, WIP commits) in one lasting info summary;
# cancel_build for superseded builds still running (executed by the CI connector, only in
# act mode and only with [connectors.github.ci] allow_cancel); a CI minutes forecast
# (warning before the quota runs out, critical with the waiting tasks once it has). Needs
# builds from [connectors.github.ci] below.
#
# [engine.rules.ci_economy]
# mode = "observe"
# window = "24h"                 # builds looked at and the burn-rate window; at most
#                                # [connectors.github.ci] window
# docs_globs = ["docs/*", "*.md", "*.rst"]   # a build is docs-only if every path matches
# wip_patterns = ['^\s*\[?wip\b', '^\s*(fixup|squash)!']   # commit messages, case-insensitive
# waste_min_minutes = 30         # summary once this many minutes were wasted in the window
# cancel_superseded = true
# quota_critical = 1.0           # used / quota at which the quota counts as exhausted
# forecast_horizon = "7d"        # warn when the quota runs out within this (before reset)
# quota_period = "30d"           # without a usage reading: warn if the burn over this
#                                # period would exceed the quota
# max_reading_age = "1h"

[storage]
path = "kelpie.db"        # action ledger (SQLite); ":memory:" keeps it in memory.
                          # $KELPIE_DB overrides this.

# OTLP trace ingest on POST /v1/traces (same port as /metrics). See README "Traces".
[traces]
enabled = true
# token_env = "KELPIE_TRACES_TOKEN"  # env var with the bearer token exporters must send.
#   Default: used when set, else the endpoint is open (a warning is logged). Uncommented,
#   the variable must be set or Kelpie refuses to start.
window = "30m"            # stored spans each control-loop tick sees (rules look back
                          # about 10 minutes)
totals_window = "24h"     # per-session totals (calls, errors, tokens) in each tick
retention = "7d"          # spans older than this are pruned (hourly, in the background)
max_rows = 1000000        # ...and the oldest beyond this row count
max_body_bytes = 8388608  # larger requests (also after gunzip) get 413
max_snapshot_spans = 50000  # at most this many stored spans per tick, newest first
max_concurrent_requests = 4 # requests decoded at once; more get 503 (exporters retry)
allow_unauthenticated = false  # true: no token needed even on a non-loopback address.
                          # Without a token and without this, `kelpie serve` refuses to
                          # listen on anything but 127.0.0.1/::1.
task_attribute = "kelpie.task_id"        # span or resource attribute naming the task
session_attribute = "kelpie.session_id"  # else gen_ai.conversation.id, else session.id
commands = true           # keep the prefix of shell commands on tool spans ("make test",
                          # "xcodebuild"), redacted; the command itself is never stored

# Forward accepted OTLP requests, unchanged, to other backends (off unless configured; one
# table per destination; secret header values come from env vars). See README "Traces".
#
# [[traces.forward]]
# name = "langfuse"                       # metric label; default: the endpoint's host
# endpoint = "https://cloud.langfuse.com/api/public/otel/v1/traces"
# headers_env = { Authorization = "LANGFUSE_AUTH" }   # "Basic base64(pk:sk)"
# headers = { "x-langfuse-ingestion-version" = "4" }
# timeout = "10s"
# queue_size = 1000                       # requests waiting; beyond that they are dropped
# queue_bytes = 67108864                  # ...and bytes waiting (64 MiB)
# retries = 3                             # for network errors, 429 and 5xx (at most 10)

# Huge tool outputs: tool calls ranked by output tokens per role and command prefix, with a
# filter recommendation (RTK first) and before/after; the daily report reads them.
# Only the size of an output is recorded, never the output. All keys optional; see
# kelpie.traces.outputs.
#
# [traces.outputs]
# threshold_tokens = 4000   # recommend a filter when calls average at least this...
# min_calls = 3             # ...over at least this many unfiltered calls
# repeat_days = 2           # above the threshold on this many days: a repeated offender
# window = "1d"             # each side of a before/after comparison
# min_sample = 5            # fewer calls on a side: labelled a small sample
# owners = { developer = "human-owner" }  # role -> who owns that role's instructions
#
# Replaces the default table (rtk, xcbeautify, errors-only, range); first match wins.
# [[traces.outputs.filters]]
# name = "rtk"
# how = "install RTK and its hook for this platform"
# commands = ["git", "cargo", "npm", "pytest"]   # globs over the prefix or executable
# platforms = ["hermes", "claude-code"]          # omit: any platform
# reduction = 0.6                                # expected share of tokens removed

# Budgets: spend priced from traces (needs [traces]). See README "Budgets and spend".
# scope: day (whole farm) | agent | task | project; unit: usd | tokens; soft and/or hard
# (hard > soft). Windows are rolling and must fit in [traces] retention.
#
# [[budgets]]
# name = "farm-daily"
# scope = "day"
# unit = "usd"
# soft = 50                 # alert
# hard = 100                # stop the run (act mode only)
# window = "24h"            # default 24h; task budgets: the span retention
# burn_window = "1h"        # burn rate and "runs out at" forecast over this
# mode = "api"              # api | subscription (spend is an estimate; forecast is the
#                           # time to the next provider limit once limit hits are known)
# providers = ["provider-main"]  # subscription: the limits (LLM provider names in
#                           # [connectors.llm_quotas]) whose hits drive that forecast;
#                           # default: all of them
# min_limit_window = "10m"  # subscription: ignore hits whose limit refills sooner than
#                           # this (per-minute rate limits are not the usage limit);
#                           # hits without a reset time always count
#
# [[budgets]]
# name = "web-project"
# scope = "project"
# match = "label:web"       # or a task id glob such as "WEB-*"; agent/task budgets take
#                           # an owner or task id (glob); without match: each on its own
# unit = "tokens"
# hard = 20000000
#
# USD per 1M tokens, per model name or glob (exact names first, then globs in order).
# Models without a price: tokens still count, their cost is unknown (not guessed).
#
# [prices."model-a"]
# input = 3
# output = 15
# cached_input = 0.3        # default: the input price

# Host metrics from node_exporter through the Prometheus HTTP API. Off unless this table
# exists. Kelpie runs fixed instant queries (GET /api/v1/query) and keeps only the hosts
# listed below. Redirects and environment proxies are never followed, so the token goes
# only to `url`; it is never logged. A Prometheus that is down gives no readings (and
# kelpie_resource_read_failures_total), never stale ones.
#
# [resources.prometheus]
# url = "http://prometheus:9090"      # http(s) base URL, no credentials, no query string
# hosts = { host-a = "host-a:9100", host-b = "host-b:9100" }  # Kelpie host name = host_label value
# host_label = "instance"             # label that identifies the machine in node_exporter series
# timeout = "5s"                      # per query (at most 60s); a failed query ends the fetch
# interval = "60s"                    # at most one fetch this often (at least 5s)
# token_env = "KELPIE_PROMETHEUS_TOKEN"  # bearer token from this env var. Used when set; when
#                                     # written here the variable must be set or Kelpie refuses to start
#
# Queries are PromQL and can be replaced one by one. Each result must keep the host_label
# label (and `mountpoint` for the disk ones). The defaults, for node_exporter:
#
# [resources.prometheus.queries]
# disk_size = 'node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|devtmpfs|nsfs|proc|sysfs|cgroup.*|fuse.*|autofs"}'
# disk_avail = 'node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|devtmpfs|nsfs|proc|sysfs|cgroup.*|fuse.*|autofs"}'
# memory_total = "node_memory_MemTotal_bytes"
# memory_available = "node_memory_MemAvailable_bytes"
# load1 = "node_load1"
# cores = 'count by (instance) (node_cpu_seconds_total{mode="idle"})'
# cpu_busy = '100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))'
# processes = "node_processes_pids"           # needs node_exporter --collector.processes
# processes_max = "node_processes_max_processes"

# LLM provider quotas and key health, for rule 7. Off unless providers are listed. Each
# provider is probed with one GET of `path` at most once per `interval`. Probes must cost
# nothing: point `path` at an endpoint that lists models, describes the key or reports
# usage, never at one that generates text (Kelpie only sends GETs without a body; whether a
# GET is free is the provider's rule, so check its docs). The endpoint must also require
# the key: any 2xx answer counts as "the key works". The key is read from `token_env` (the
# variable must be set and printable ASCII, or Kelpie refuses to start) and goes only to
# `api_url`: https only (plain http only to loopback), redirects are never followed, and
# the key is never logged. An https_proxy from the environment (honouring no_proxy) is used
# as a CONNECT tunnel, so the proxy never sees the key. 401/403 mark the key as rejected;
# 429 records a limit hit; other failures leave the quota unknown (kelpie_llm_provider_up
# 0), never stale. A 2xx without any configured field is logged once (check the fields).
# Probes run one after another in the control loop, staggered over the interval and
# within a wall-clock budget per tick; providers not reached go first next tick.
#
# [connectors.llm_quotas]
# tick_budget = "10s"               # all probes of one tick together (0.5s to 60s)
#
# [[connectors.llm_quotas.providers]]
# name = "provider-main"            # used in alerts, metrics and provider_roles
# kind = "headers"                  # read rate-limit headers of the answer (body ignored)
# api_url = "https://api.provider.example"
# path = "/v1/models"               # zero-cost endpoint (may carry a non-secret query)
# token_env = "KELPIE_PROVIDER_MAIN_KEY"
# auth_header = "Authorization"     # header that carries the key ...
# auth_scheme = "Bearer"            # ... as "<scheme> <key>"; "" sends the bare key
# headers = { x-api-version = "1" } # static, non-secret extra headers
# unit = "requests"                 # what remaining/limit count
# interval = "5m"                   # at least 30s
# timeout = "10s"                   # whole request, at most 60s
# [connectors.llm_quotas.providers.fields]  # header names; these are the defaults (IETF)
# remaining = "ratelimit-remaining"
# limit = "ratelimit-limit"
# resets_at = "ratelimit-reset"     # seconds, Unix time, a duration like 1m30s, or a date
# # used = "..."; expires_at = "..." (key expiry) are also understood
#
# [[connectors.llm_quotas.providers]]
# name = "provider-b"
# kind = "status_url"               # a JSON answer; fields are dotted paths into it
# api_url = "https://api.provider-b.example"
# path = "/v1/key"
# token_env = "KELPIE_PROVIDER_B_KEY"
# [connectors.llm_quotas.providers.fields]
# used = "data.usage"               # remaining = limit - used when remaining is not given
# limit = "data.limit"
# resets_at = "data.reset_at"
# expires_at = "data.expires_at"

# Platform adapters. Kelpie reads the board and, for now, changes it only to stop a run
# (loop_breaker in act mode, through the Hermes CLI); the other Hermes actions are not
# implemented yet: keep other rules in observe or suggest mode. Any other rule in act mode
# with dry_run = false and Hermes as the only adapter stops Kelpie at startup.
#
# [adapters.hermes]
# db_path = "~/.hermes/kanban.db"   # named boards: ~/.hermes/kanban/boards/<slug>/kanban.db
# spool = "~/.hermes/kelpie/spool.jsonl"  # tool-call spans from the Hermes plugin; false = off
# lookback = "24h"                  # runs, spans and finished tasks older than this are left out
#                                    (the rules' window; kelpie report reads as far back as its day needs)
# enabled = true
# git_state = true                  # git state (commit, branch, dirty files) of live task workspaces
# git_timeout = "5s"                # limit for each git call; 2x per snapshot in total (up to
#                                   # 3 + base_refs + 1 + merge-bases calls per worktree)
# base_refs = ["origin/main", "main"]  # a task's files (rule 12) are what it changed since its
#                                   # merge-base with these, plus uncommitted files
# cli = "hermes"                    # Hermes executable used to stop a run (name on PATH or a path)
# cli_timeout = "10s"               # limit for that command (at most 60s); it runs inside the tick
# human_owners = ["alice"]         # assignees that are people, not agents (see
#                                   # [connectors.human_tasks]); case-insensitive. Not a Hermes
#                                   # profile. Also sets rule 5's default escalation target
#                                   # (first human by id): set escalate_to explicitly.
#
# Roles (rule 6 compares capacity per role). Hermes has none: a profile's role is its name
# without a trailing "-<number>" (dev-1, dev-2 -> dev), unless listed here; set
# role_from_name = false under [adapters.hermes] to keep every profile its own role. Config
# keyed by role (loop_breaker roles, heavy_roles, provider_roles, review_roles) uses these
# role names, so per-profile keys such as "dev-1" stop matching once it maps to "dev".
# [adapters.hermes.roles]
# reviewer-bot = "reviewer"
# merger = "reviewer"
#
# Recommended on Hermes. A valid Hermes claim counts as a heartbeat, but Hermes tolerates
# heartbeats up to an hour old, while Kelpie's default is 30 minutes:
#
# [engine.rules.exit_contract]
# session_stale_after = "60m"
# [engine.rules.orphan_status]
# session_stale_after = "60m"
# [engine.rules.wait_condition]
# session_stale_after = "60m"
# [engine.rules.checkpoints]
# session_stale_after = "60m"
# [engine.rules.bottlenecks]
# ready_is_queued = true    # Hermes assigns a task to a profile before it dispatches it
#
# Blocks. The adapter reports Hermes typed blocks (needs_input, capability, transient) as
# "waiting_human: <kind>: <reason>" and circuit-breaker parks as "guard: hermes circuit
# breaker ...", both allowed by default. The alternative is to leave the adapter's wording
# alone and list the Hermes kinds yourself (this replaces the default list):
#
# [engine.rules.exit_contract]
# allowed_block_reasons = ["guard", "waiting_ci", "waiting_pr_merge", "waiting_human", "quota",
#                          "needs_input", "capability", "transient"]

# Claude Code (src/kelpie/adapters/claude_code/README.md): shared task lists plus the spool
# of its command hook. Read-only, except stop (a marker the hook enforces); other actions
# become alerts ("not executed").
# [adapters.claude_code]
# task_lists = ["farm"]             # CLAUDE_CODE_TASK_LIST_ID values to read; [] = none
# tasks_dir = "~/.claude/tasks"
# spool = "~/.claude/kelpie/spool.jsonl"  # written by the hook; false = off
# lookback = "24h"                  # sessions and completed tasks older than this are left out
# stop_dir = "~/.claude/kelpie/stop"  # stop markers the hook enforces; false = alert instead
# enabled = true

# GitHub connector (read-only): evaluates pr_merged and ci_status conditions for these
# repositories only. The token is read from the named env var and sent only to api_url;
# redirects are never followed. Uncommented, token_env must be set or Kelpie refuses to
# start; by default $GITHUB_TOKEN is used when set, else GitHub is read anonymously.
#
# Human tasks: a `human_task` condition (params.task = the id of a task owned by a human
# on the same board) holds once that task is done, so an agent task
# can wait on a person without polling; rule 2 then wakes it. Needs no service, only the
# board the adapter reads. Who is a human is adapter config (human_owners above).
#
# Only `done` satisfies it; a failed or cancelled human task makes rules 2 and 4 alert at once.
# Agents often block their own task naming the task they wait on. Patterns (case-insensitive,
# named group `task`) attach a condition to such a block when that task is on the board and
# owned by a human; the block is then a declared wait that rule 4 clears when it is done.
#
# [connectors.human_tasks]
# enabled = true                    # false keeps the section but evaluates nothing
#
# [[connectors.human_tasks.block_patterns]]
# pattern = 'waiting[_ ]human:.*?(?P<task>t_[0-9a-f]+)'
#
# [connectors.github]
# repos = ["example/repo"]          # owner/name; nothing else is ever queried
# token_env = "GITHUB_TOKEN"        # a fine-grained token with read access to PRs and checks
# api_url = "https://api.github.com"  # GitHub Enterprise: "https://<host>/api/v3" (then
#                                   # token_env must be set explicitly)
# timeout = "10s"                   # whole request, connect to last byte (at most 60s)
# cache_ttl = "60s"                 # answers (errors too) reused this long, then revalidated
#                                   # by ETag; at least 30s
# max_requests_per_tick = 50        # beyond this, cached answers or an unknown result
# tick_budget = "10s"               # wall-clock time for GitHub per tick (at most 60s)
# enabled = true                    # false keeps the section but does not query GitHub
#
# GitHub Actions runs for rule 9 (ci_economy). Reading needs Actions: read, Pull requests:
# read and Contents: read. cancel_build is the only write Kelpie can make to GitHub: off
# unless allow_cancel is set. It needs Actions: write: put that on a separate token
# (cancel_token_env) scoped to cancel_repos only, and keep the main token read-only. A run
# is cancelled only if the last scan offered it as cancellable (superseded by a newer
# push/pull_request run of the same workflow, branch and PR, still active, not on the
# default branch, not a re-run, within the cancel policy) and a fresh re-check right before
# the request agrees.
#
# Open PRs for rule 6 (bottlenecks): hold labels on PRs (holds/hold_labels) hold the task on
# the PR's head branch and age from when the label went on; mergeable PRs count as ready
# work. A task is linked to its PR by branch (Hermes: tasks.branch_name, else the worktree's).
#
# [connectors.github.pulls]
# poll_interval = "2m"              # list open PRs this often (at least 30s)
# max_details = 20                  # PRs whose mergeable state is read per scan (0 to 100):
#                                   # one request each, within max_requests_per_tick
# enabled = true
#
# Rate limit: a scan runs every poll_interval and spends at most max_requests_per_tick
# requests: 100 every 2 minutes is at most 3,000 of a token's 5,000 an hour (304s are
# free). While fewer than rate_reserve requests are left in the hour, scans are skipped so
# PR and CI conditions keep working.
#
# [connectors.github.ci]
# repos = ["example/repo"]          # default: all repos above; must be among them
# window = "24h"                    # runs created within this (1h to 7d); rule 9's
#                                   # window must not be longer
# poll_interval = "2m"              # scan this often (30s to 1h); the last scan in between
# rate_reserve = 1000               # skip scans while fewer requests are left this hour
#                                   # (at most a fifth of the hourly limit)
# max_pages = 3                     # pages of 100 runs per repo per scan (at most 10)
# max_requests_per_tick = 30        # this step's own budget per scan (at most 100): page 1
#                                   # of every repo first, then default branches, further
#                                   # pages, PRs, PR files and job lists
# tick_budget = "10s"
# included_minutes = 3000           # monthly quota -> a ci_minutes resource (optional);
#                                   # minutes used are not read (the billing API needs
#                                   # admin rights): the rule projects the burn instead
# quota_reset_day = 1               # day of the month the quota resets (UTC)
# allow_cancel = false
# cancel_repos = []                 # required with allow_cancel; among repos above
# cancel_workflows = []             # optional: only these workflow paths, e.g.
#                                   # ".github/workflows/ci.yml"
# cancel_branches = []              # optional globs, e.g. ["task/*"]; empty: any branch
#                                   # but the repository's default branch (never cancelled)
# cancel_token_env = "KELPIE_GITHUB_CANCEL_TOKEN"   # optional: a token with Actions: write
#                                   # on cancel_repos only, used for the cancel request only
#
# Blocks that are really waits. When a blocked task's reason matches a pattern and names a
# PR GitHub has confirmed to exist, Kelpie attaches a condition of that kind to the block,
# so rule 4 clears the block when it holds (and alerts only if it stays unmet past
# max_block, or at once if the PR was closed without merging) instead of alerting on a
# block without a condition. Rule 1 then treats the block as a declared wait and does not
# requeue it. Patterns are case-insensitive regexes with a named group `pr`: "#123", "123",
# "owner/repo#123" or a PR link. Matched blocks whose PR cannot be resolved or confirmed
# stay as they are (kelpie_block_conditions{outcome="unresolved"|"unconfirmed"}).
#
# [[block_conditions]]
# pattern = 'waiting for (?:ci/)?merge of (?P<pr>\S+)'
# kind = "pr_merged"                # pr_merged | ci_green
# repo = "example/repo"             # for bare refs such as "#123"; must be in repos above
#
# [[block_conditions]]
# pattern = 'waiting for (?:green )?ci (?:on|of) (?P<pr>\S+)'
# kind = "ci_green"
# repo = "example/repo"
#
# The dispatch gate: applies_to = ["ready_task"] reads the title and description of a ready
# task instead of a block reason ("block" is the default; both may be listed). Every PR it
# names (up to 5) becomes a prerequisite, and the dispatch_gate rule parks the task until
# they hold.
# [[block_conditions]]
# pattern = 'after (?P<pr>\S+) (?:lands|is merged)'
# kind = "pr_merged"
# repo = "example/repo"
# applies_to = ["ready_task"]

# Real-time alerts. None are sent without a channel. An alert goes to every channel whose
# min_severity it reaches; each message shows the transition (new, still open, changed,
# resolved) and what Kelpie already did. Nothing leaves Kelpie while engine.dry_run is true.
# Delivery runs on a background worker per channel (bounded queue). A transient failure
# (429, 5xx, network) is retried with a capped exponential backoff, honouring retry_after,
# for retry_horizon; a 429 also holds back the alerts queued behind it. An alert that is
# still undelivered then is lost and counted (kelpie_alerts_failed_total; the Prometheus rule
# in deploy/prometheus/rules fires on it). Alerts that do not fit the queue, or are still
# queued when Kelpie shuts down, are dropped and counted (kelpie_alerts_dropped_total).
# `kelpie status` lists the channels, never their secrets.
#
# [alerts]
# dedup_window = "10m"      # identical alerts within this window are sent once per channel
# queue_size = 50           # per channel
# retry_horizon = "15m"     # how long a transient failure is retried before the alert is lost
#
# [[alerts.channels]]
# type = "telegram"
# token_env = "KELPIE_TELEGRAM_TOKEN"  # variable holding the bot token (from @BotFather);
#                                      # must be set at startup, its value is never logged
# chat_id = "-1001234567890"           # a chat id, or "@channelname"
# timeout = "10s"
# min_severity = "warning"             # info | warning | critical
# # name = "telegram"                  # only needed with two telegram channels
# # api_url = "https://api.telegram.org"  # e.g. a local Bot API server (http only on loopback)
#
# [[alerts.channels]]
# type = "slack"
# webhook_env = "KELPIE_SLACK_WEBHOOK" # variable holding a Slack incoming-webhook URL
#                                      # (https://hooks.slack.com/services/...). The URL is a
#                                      # secret: checked at startup, never logged or shown
# timeout = "10s"
# min_severity = "critical"            # info | warning | critical
# # name = "slack"                     # only needed with two slack channels
# # allow_host = "relay.example.org"   # another host for the webhook (plain http only if it
# #                                    # is loopback); for relays and tests

# Daily "cost of chaos" report: `kelpie report [--date YYYY-MM-DD] [--send]`, scheduled on
# the host (cron or a timer shortly after midnight). See README "Daily report".
#
# [report]
# timezone = "UTC"                 # where a day starts and ends (IANA name)
# at = "00:15"                     # kelpie serve runs yesterday's report at this local time
# dir = "/var/lib/kelpie/reports"  # writes kelpie-report-<date>.md; unset: stdout only
# task_url = "https://board.example.org/tasks/{id}"  # links task ids in the Markdown
# hour_usd = 2.5                   # what a stuck task-hour costs; unset: hours stay hours
# channels = ["telegram"]          # [[alerts.channels]] that get the summary (unset: all)
# severity = "warning"             # sent at this severity (channels filter by min_severity)
# verify_window = "1d"             # before/after of fixes: this long on each side
# review_roles = ["reviewer"]      # whose sessions make "review time"
# min_sample = 10                  # fewer observations on a side: a small sample
# [report.sections.<name>]         # settings of one report section (keys it declares; any
#                                  # other key: noted, and the section is skipped)
#
# Context and model fit (kelpie.traces.fit). A switch to a cheaper model is recommended
# only for roles named here: short outputs alone do not make work routine.
# [report.sections.tokens_fit]
# routine_roles = ["triage", "status"]  # roles whose routine work may move to a cheaper model
# allowed_models = ["model-small"]      # candidates besides the models the farm already runs
# routine_min_calls = 20                # calls a day before a role counts as routine
# routine_output_tokens = 400           # median output per call at most
# routine_max_tool_tokens = 1000        # mean tool output per call at most
# min_after = "12h"                     # after a switch, wait this long before judging it
# min_saving_tokens = 50000             # a recommendation needs at least this a day
#
# Token optimization (kelpie.traces.tokens): prompt cache, context growth, restarts.
# [report.sections.tokens]
# cache_ttl = "5m"                      # the provider's cache lifetime (some offer 1h)
# runaway_tokens = 100000               # a session past this without compacting runs away
# compact_at = 50000                    # where compacting or a handoff would cut it
# min_saving_tokens = 50000             # a recommendation needs at least this a day
