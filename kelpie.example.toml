# Kelpie configuration. Copy to kelpie.toml (or point --config / $KELPIE_CONFIG at it).
# Every key is optional; the values below are the defaults unless noted.

[engine]
interval = "30s"          # how often the control loop ticks
dry_run = true            # global override: when true nothing leaves Kelpie in any mode
default_mode = "observe"  # observe | suggest | act, for rules without their own mode
cooldown = "30m"          # the same action is not repeated within this window
retry_after = "5m"        # ...except after a failure, which may be retried sooner
max_actions_per_task_per_hour = 6  # actions with an effect per task (else session, rule)
once_window = "7d"        # one-off actions (WIP commit, resume note) are done once per window
once_attempts = 3         # ...and given up after this many failed attempts

# One table per rule: an optional mode plus the rule's own parameters. Names must be in
# the plan (kelpie.rules.PLANNED); unknown names stop Kelpie at startup, and planned rules
# that are not implemented yet are skipped with a warning. `kelpie status` shows the result.
#
# [engine.rules.stale_blocks]
# mode = "suggest"
# unblock_grace = "5m"
#
# [engine.rules.checkpoints]
# commit_every = "30m"      # remind a live session to commit after this long
# max_changed_files = 20    # ...or once it has more changed files than this
# wip_ci = "skip_ci"        # WIP commit on exit: "skip_ci" ([skip ci]) or "draft_pr"
# act_within = "24h"        # WIP commit and resume note only this long after the exit

[storage]
path = "kelpie.db"        # action ledger (SQLite); ":memory:" keeps it in memory.
                          # $KELPIE_DB overrides this.

# Platform adapters. Kelpie only reads the board and, for now, cannot change it (Hermes
# actions are not implemented yet): keep rules in observe or suggest mode. A rule in act
# mode with dry_run = false and Hermes as the only adapter stops Kelpie at startup.
#
# [adapters.hermes]
# db_path = "~/.hermes/kanban.db"   # named boards: ~/.hermes/kanban/boards/<slug>/kanban.db
# spool = "~/.hermes/kelpie/spool.jsonl"  # tool-call spans from the Hermes plugin; false = off
# lookback = "24h"                  # runs, spans and finished tasks older than this are left out
# enabled = true
# git_state = true                  # git state (commit, branch, dirty files) of live task workspaces
# git_timeout = "5s"                # limit for each git call; 2x per snapshot in total
#
# Recommended on Hermes. A valid Hermes claim counts as a heartbeat, but Hermes tolerates
# heartbeats up to an hour old, while Kelpie's default is 30 minutes:
#
# [engine.rules.exit_contract]
# session_stale_after = "60m"
# [engine.rules.orphan_status]
# session_stale_after = "60m"
# [engine.rules.wait_condition]
# session_stale_after = "60m"
# [engine.rules.checkpoints]
# session_stale_after = "60m"
#
# Blocks. The adapter reports Hermes typed blocks (needs_input, capability, transient) as
# "waiting_human: <kind>: <reason>" and circuit-breaker parks as "guard: hermes circuit
# breaker ...", both allowed by default. The alternative is to leave the adapter's wording
# alone and list the Hermes kinds yourself (this replaces the default list):
#
# [engine.rules.exit_contract]
# allowed_block_reasons = ["guard", "waiting_ci", "waiting_pr_merge", "waiting_human", "quota",
#                          "needs_input", "capability", "transient"]
