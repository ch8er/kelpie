# Kelpie configuration. Copy to kelpie.toml (or point --config / $KELPIE_CONFIG at it).
# Every key is optional; the values below are the defaults unless noted.

[engine]
interval = "30s"          # how often the control loop ticks
dry_run = true            # global override: when true nothing leaves Kelpie in any mode
default_mode = "observe"  # observe | suggest | act, for rules without their own mode
cooldown = "30m"          # the same action is not repeated within this window
retry_after = "5m"        # ...except after a failure, which may be retried sooner
max_actions_per_task_per_hour = 6  # actions with an effect per task (else session, rule)
once_window = "7d"        # one-off actions (WIP commit, resume note) are done once per window
once_attempts = 3         # ...and given up after this many failed attempts

# One table per rule: an optional mode plus the rule's own parameters. Names must be in
# the plan (kelpie.rules.PLANNED); unknown names stop Kelpie at startup, and planned rules
# that are not implemented yet are skipped with a warning. `kelpie status` shows the result.
#
# [engine.rules.stale_blocks]
# mode = "suggest"
# unblock_grace = "5m"
#
# [engine.rules.checkpoints]
# commit_every = "30m"      # remind a live session to commit after this long
# max_changed_files = 20    # ...or once it has more changed files than this
# wip_ci = "skip_ci"        # WIP commit on exit: "skip_ci" ([skip ci]) or "draft_pr"
# act_within = "24h"        # WIP commit and resume note only this long after the exit
#
# [engine.rules.no_progress]
# window = "30m"            # tokens vs. progress over this long; [traces] window must be
#                           # at least this long (Kelpie warns at startup otherwise)
# min_tokens_without_progress = 100000  # alert at this many tokens and no progress
# claim_grace = "2m"        # a status change this soon after the session start is the claim
#
# [engine.rules.loop_breaker]
# mode = "suggest"          # stop needs a platform adapter that can stop a run; until then
#                           # use observe or suggest
# identical_calls = 8       # identical consecutive tool calls (same tool + arguments)...
# identical_window = "10m"  # ...with the last ones this close together
# consecutive_errors = 5    # failed tool calls in a row...
# error_window = "10m"      # ...the last one at most this long ago...
# min_error_span = "60s"    # ...and the streak at least this long (not one parallel batch)
# stop_on_shared_budgets = false  # hard day/project budgets only alert; true also stops
# forecast_horizon = "2h"   # info alert when a budget (or a subscription limit) is this near
# poll_grace = "15m"        # polling that matches poll_patterns: rule 2 coaches first; stop
#                           # only this long after its comment, or at poll_hard_limit calls
# poll_hard_limit = 30
# [engine.rules.loop_breaker.poll_patterns]   # optional: taken from wait_condition's unless set
# ci_status = ["gh pr checks"]
# [engine.rules.loop_breaker.agents.agent-ops-1]   # per agent (owner id) ...
# identical_calls = 20
# [engine.rules.loop_breaker.roles.maintenance]    # ... or per role; agent wins
# consecutive_errors = 8

# Rule 7: disk, memory, CPU, load and process thresholds per host, and a limit on heavy
# tasks while a host is overloaded. Utilization is used / limit (load: per core). Each
# threshold can be set to false to switch it off. Readings older than max_reading_age are
# ignored. Alerts only: Kelpie suggests, a human or the dispatcher acts. Needs host
# readings: see [resources.prometheus] below.
#
# [engine.rules.resources]
# mode = "suggest"
# disk_warning = 0.85       # also disk_critical (0.95)
# memory_warning = 0.90     # also memory_critical (0.97)
# load_warning = 1.5        # load1 / cores; also load_critical (3.0)
# cpu_warning = 0.95        # off by default (load covers overload); also cpu_critical
# processes_warning = 0.80  # processes / process limit; also processes_critical (0.95). The
#                           # default query divides by pid_max (often 4 million), so this
#                           # rarely fires; set the processes_max query to a real ceiling
# heavy_label = "heavy"     # tasks with this label (or a label in heavy_labels = [...]) ...
# heavy_roles = []          # ... or in one of these roles are heavy
# max_heavy_per_host = 2    # alert when an overloaded host runs more heavy tasks at once
#                           # (default: not checked). Needs an adapter that sets Task.host
#                           # (the Hermes adapter does not yet): with several hosts and tasks
#                           # that do not say where they run, you get one alert without a host
# max_reading_age = "10m"

[storage]
path = "kelpie.db"        # action ledger (SQLite); ":memory:" keeps it in memory.
                          # $KELPIE_DB overrides this.

# OTLP trace ingest on POST /v1/traces (same port as /metrics). See README "Traces".
[traces]
enabled = true
# token_env = "KELPIE_TRACES_TOKEN"  # env var with the bearer token exporters must send.
#   Default: used when set, else the endpoint is open (a warning is logged). Uncommented,
#   the variable must be set or Kelpie refuses to start.
window = "30m"            # stored spans each control-loop tick sees (rules look back
                          # about 10 minutes)
totals_window = "24h"     # per-session totals (calls, errors, tokens) in each tick
retention = "7d"          # spans older than this are pruned (hourly, in the background)
max_rows = 1000000        # ...and the oldest beyond this row count
max_body_bytes = 8388608  # larger requests (also after gunzip) get 413
max_snapshot_spans = 50000  # at most this many stored spans per tick, newest first
max_concurrent_requests = 4 # requests decoded at once; more get 503 (exporters retry)
allow_unauthenticated = false  # true: no token needed even on a non-loopback address.
                          # Without a token and without this, `kelpie serve` refuses to
                          # listen on anything but 127.0.0.1/::1.
task_attribute = "kelpie.task_id"        # span or resource attribute naming the task
session_attribute = "kelpie.session_id"  # else gen_ai.conversation.id, else session.id

# Forward accepted OTLP requests, unchanged, to other backends (off unless configured; one
# table per destination; secret header values come from env vars). See README "Traces".
#
# [[traces.forward]]
# name = "langfuse"                       # metric label; default: the endpoint's host
# endpoint = "https://cloud.langfuse.com/api/public/otel/v1/traces"
# headers_env = { Authorization = "LANGFUSE_AUTH" }   # "Basic base64(pk:sk)"
# headers = { "x-langfuse-ingestion-version" = "4" }
# timeout = "10s"
# queue_size = 1000                       # requests waiting; beyond that they are dropped
# queue_bytes = 67108864                  # ...and bytes waiting (64 MiB)
# retries = 3                             # for network errors, 429 and 5xx (at most 10)

# Budgets: spend priced from traces (needs [traces]). See README "Budgets and spend".
# scope: day (whole farm) | agent | task | project; unit: usd | tokens; soft and/or hard
# (hard > soft). Windows are rolling and must fit in [traces] retention.
#
# [[budgets]]
# name = "farm-daily"
# scope = "day"
# unit = "usd"
# soft = 50                 # alert
# hard = 100                # stop the run (act mode only)
# window = "24h"            # default 24h; task budgets: the span retention
# burn_window = "1h"        # burn rate and "runs out at" forecast over this
# mode = "api"              # api | subscription (spend is an estimate; forecast is the
#                           # time to the next provider limit once limit hits are known)
#
# [[budgets]]
# name = "web-project"
# scope = "project"
# match = "label:web"       # or a task id glob such as "WEB-*"; agent/task budgets take
#                           # an owner or task id (glob); without match: each on its own
# unit = "tokens"
# hard = 20000000
#
# USD per 1M tokens, per model name or glob (exact names first, then globs in order).
# Models without a price: tokens still count, their cost is unknown (not guessed).
#
# [prices."model-a"]
# input = 3
# output = 15
# cached_input = 0.3        # default: the input price

# Host metrics from node_exporter through the Prometheus HTTP API. Off unless this table
# exists. Kelpie runs fixed instant queries (GET /api/v1/query) and keeps only the hosts
# listed below. Redirects and environment proxies are never followed, so the token goes
# only to `url`; it is never logged. A Prometheus that is down gives no readings (and
# kelpie_resource_read_failures_total), never stale ones.
#
# [resources.prometheus]
# url = "http://prometheus:9090"      # http(s) base URL, no credentials, no query string
# hosts = { host-a = "host-a:9100", host-b = "host-b:9100" }  # Kelpie host name = host_label value
# host_label = "instance"             # label that identifies the machine in node_exporter series
# timeout = "5s"                      # per query (at most 60s); a failed query ends the fetch
# interval = "60s"                    # at most one fetch this often (at least 5s)
# token_env = "KELPIE_PROMETHEUS_TOKEN"  # bearer token from this env var. Used when set; when
#                                     # written here the variable must be set or Kelpie refuses to start
#
# Queries are PromQL and can be replaced one by one. Each result must keep the host_label
# label (and `mountpoint` for the disk ones). The defaults, for node_exporter:
#
# [resources.prometheus.queries]
# disk_size = 'node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|devtmpfs|nsfs|proc|sysfs|cgroup.*|fuse.*|autofs"}'
# disk_avail = 'node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|devtmpfs|nsfs|proc|sysfs|cgroup.*|fuse.*|autofs"}'
# memory_total = "node_memory_MemTotal_bytes"
# memory_available = "node_memory_MemAvailable_bytes"
# load1 = "node_load1"
# cores = 'count by (instance) (node_cpu_seconds_total{mode="idle"})'
# cpu_busy = '100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])))'
# processes = "node_processes_pids"           # needs node_exporter --collector.processes
# processes_max = "node_processes_max_processes"

# Platform adapters. Kelpie reads the board and, for now, changes it only to stop a run
# (loop_breaker in act mode, through the Hermes CLI); the other Hermes actions are not
# implemented yet: keep other rules in observe or suggest mode. Any other rule in act mode
# with dry_run = false and Hermes as the only adapter stops Kelpie at startup.
#
# [adapters.hermes]
# db_path = "~/.hermes/kanban.db"   # named boards: ~/.hermes/kanban/boards/<slug>/kanban.db
# spool = "~/.hermes/kelpie/spool.jsonl"  # tool-call spans from the Hermes plugin; false = off
# lookback = "24h"                  # runs, spans and finished tasks older than this are left out
# enabled = true
# git_state = true                  # git state (commit, branch, dirty files) of live task workspaces
# git_timeout = "5s"                # limit for each git call; 2x per snapshot in total
# cli = "hermes"                    # Hermes executable used to stop a run (name on PATH or a path)
# cli_timeout = "10s"               # limit for that command (at most 60s); it runs inside the tick
# human_owners = ["alice"]         # assignees that are people, not agents (see
#                                   # [connectors.human_tasks]); case-insensitive
#
# Recommended on Hermes. A valid Hermes claim counts as a heartbeat, but Hermes tolerates
# heartbeats up to an hour old, while Kelpie's default is 30 minutes:
#
# [engine.rules.exit_contract]
# session_stale_after = "60m"
# [engine.rules.orphan_status]
# session_stale_after = "60m"
# [engine.rules.wait_condition]
# session_stale_after = "60m"
# [engine.rules.checkpoints]
# session_stale_after = "60m"
#
# Blocks. The adapter reports Hermes typed blocks (needs_input, capability, transient) as
# "waiting_human: <kind>: <reason>" and circuit-breaker parks as "guard: hermes circuit
# breaker ...", both allowed by default. The alternative is to leave the adapter's wording
# alone and list the Hermes kinds yourself (this replaces the default list):
#
# [engine.rules.exit_contract]
# allowed_block_reasons = ["guard", "waiting_ci", "waiting_pr_merge", "waiting_human", "quota",
#                          "needs_input", "capability", "transient"]

# GitHub connector (read-only): evaluates pr_merged and ci_status conditions for these
# repositories only. The token is read from the named env var and sent only to api_url;
# redirects are never followed. Uncommented, token_env must be set or Kelpie refuses to
# start; by default $GITHUB_TOKEN is used when set, else GitHub is read anonymously.
#
# Human tasks: a `human_task` condition (params.task = the id of a task owned by a human
# on the same board) holds once that task is done, failed or cancelled, so an agent task
# can wait on a person without polling; rule 2 then wakes it. Needs no service, only the
# board the adapter reads. Who is a human is adapter config (human_owners above).
#
# [connectors.human_tasks]
# enabled = true                    # false keeps the section but evaluates nothing
#
# [connectors.github]
# repos = ["example/repo"]          # owner/name; nothing else is ever queried
# token_env = "GITHUB_TOKEN"        # a fine-grained token with read access to PRs and checks
# api_url = "https://api.github.com"  # GitHub Enterprise: "https://<host>/api/v3" (then
#                                   # token_env must be set explicitly)
# timeout = "10s"                   # whole request, connect to last byte (at most 60s)
# cache_ttl = "60s"                 # answers (errors too) reused this long, then revalidated
#                                   # by ETag; at least 30s
# max_requests_per_tick = 50        # beyond this, cached answers or an unknown result
# tick_budget = "10s"               # wall-clock time for GitHub per tick (at most 60s)
# enabled = true                    # false keeps the section but does not query GitHub
#
# Blocks that are really waits. When a blocked task's reason matches a pattern and names a
# PR GitHub has confirmed to exist, Kelpie attaches a condition of that kind to the block,
# so rule 4 clears the block when it holds (and alerts only if it stays unmet past
# max_block, or at once if the PR was closed without merging) instead of alerting on a
# block without a condition. Rule 1 then treats the block as a declared wait and does not
# requeue it. Patterns are case-insensitive regexes with a named group `pr`: "#123", "123",
# "owner/repo#123" or a PR link. Matched blocks whose PR cannot be resolved or confirmed
# stay as they are (kelpie_block_conditions{outcome="unresolved"|"unconfirmed"}).
#
# [[block_conditions]]
# pattern = 'waiting for (?:ci/)?merge of (?P<pr>\S+)'
# kind = "pr_merged"                # pr_merged | ci_green
# repo = "example/repo"             # for bare refs such as "#123"; must be in repos above
#
# [[block_conditions]]
# pattern = 'waiting for (?:green )?ci (?:on|of) (?P<pr>\S+)'
# kind = "ci_green"
# repo = "example/repo"
