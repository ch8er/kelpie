workflow: |
  name: Tests
  # Runs the test matrix on every change.
  on:
    push:
      branches: [main, 'release/**']
    pull_request:

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - run: make test  # the full matrix
expected:
  changes:
  - cancel_in_progress
  - skip_drafts
  - skip_wip
  - ignore_docs_paths
  - skip_verified
  applied:
  - cancel_in_progress
  - skip_drafts
  - ignore_docs_paths
  left_out:
  - - skip_wip
    - GitHub expressions cannot match the WIP patterns (no regular expressions)
  - - skip_verified
    - GitHub Actions has no setting that skips an already verified commit
