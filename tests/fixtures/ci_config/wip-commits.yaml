id: wip-commits
waste: wip
description: >
  WIP and fixup commits were pushed without a skip marker and ran the full matrix.
config: {waste_min_minutes: 0, propose_config: true, propose_min_minutes: 30, docs_globs: [docs/*, '*.md'], cancel_superseded: false}
default_branch: main
snapshot:
  now: "2026-03-05T12:00:00+00:00"
  builds:
    - {id: W-1, source: ci, repo: example/app, workflow: .github/workflows/test.yml, event: push, status: success, branch: task/T-641, sha: 2f2f2f2, commit_message: 'WIP: parser cache', started_at: '2026-03-05T08:00:00+00:00', finished_at: '2026-03-05T08:20:00+00:00', minutes: 20}
    - {id: W-2, source: ci, repo: example/app, workflow: .github/workflows/test.yml, event: push, status: success, branch: task/T-641, sha: 3a3a3a3, commit_message: fixup! parser cache, started_at: '2026-03-05T09:00:00+00:00', finished_at: '2026-03-05T09:20:00+00:00', minutes: 20}
    - {id: W-3, source: ci, repo: example/app, workflow: .github/workflows/test.yml, event: push, status: success, branch: task/T-642, sha: 4b4b4b4, commit_message: '[wip] retry flaky test', started_at: '2026-03-05T10:00:00+00:00', finished_at: '2026-03-05T10:20:00+00:00', minutes: 20}
workflow: |
  name: Tests
  # Runs the test matrix on every change.
  on:
    push:
      branches: [main, 'release/**']
    pull_request:

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - run: make test  # the full matrix
expected:
  changes: [skip_wip]
  applied: []
  left_out:
    - [skip_wip, GitHub expressions cannot match the WIP patterns (no regular expressions)]
