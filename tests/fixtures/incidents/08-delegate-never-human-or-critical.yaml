id: "08-delegate-never-human-or-critical"
incident: 8
title: "Delegation: human-only classes, critical problems, notices and outages stay with the person"
description: >
  Only a problem class the farm lists as agent may be handed to the operator. stale_blocks
  is listed as human here, so its block stays with the person; orphan_status is agent, but
  its critical problem goes to the person at once and its notice only to the daily report;
  a CI outage is a farm-wide incident and is never delegated; a board with no delegate_to
  has no operator. Only the ownerless warning on T-815 goes to the operator.
rule: delegation
config:
  classes: {stale_blocks: human, orphan_status: agent, wait_condition: agent}
  delegate_to: {hermes: ops-1}
