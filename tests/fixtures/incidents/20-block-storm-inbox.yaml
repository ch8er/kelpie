id: "20-block-storm-inbox"
incident: 20
title: "The CEO's digest names the block storm once, not seven blocks"
description: >
  The same farm as 20-block-storm: seven agents blocked within the hour on "waiting for CEO
  (Xcode first launch)". With rule 4's storm check switched on, rule 13 gets its storm
  settings and folds the CEO's seven approvals into one digest line for the storm: one
  answer unblocks them all. The CEO's three approvals on different questions stay items of
  their own, and the tasks waiting on CI are no one's approvals.
rule: needs_you
config:
  default_approver: ceo
  approval_wait_after: "5m"
  block_storms: {min_tasks: 3, window: "2h"}
