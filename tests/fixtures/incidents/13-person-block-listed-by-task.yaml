id: "13-person-block-listed-by-task"
incident: 13
title: "Whatever the inbox lists under a person's task gets no alert of rule 4's"
description: >
  Second review of the hand-off: rule 4 left rule 13 only the blocks that ask a person in so
  many words, so two blocks reached the person twice. An agent task parked on a person's
  task by a human_task condition, its reason without an approval prefix, is listed under
  that task in the digest; and a person's own blocked task with agent work behind it is an
  item of their digest. Rule 4 raises no alert on either. A task parked on the same
  person's task but also waiting for a PR waits on that first: rule 13 does not count it as
  parked and rule 4 alerts (overdue). A person's blocked task with nothing behind it is in
  no digest: rule 4 alerts (no condition).
rule: stale_blocks
config:
  unlinked_alert_after: "4h"
  max_block: "8h"
  stale_evidence_after: "1h"
  needs_you: {approval_wait_after: "30m", human_wait_alert_after: "1h", default_approver: ceo}
snapshot:
  now: "2026-03-04T10:00:00+00:00"
  owners:
    - {id: ceo, role: owner, kind: human}
    - {id: agent-dev-1, role: developer}
  tasks:
    # S7: parked on H-7 by a human_task condition; the reason asks nobody in so many words.
    - {id: H-7, title: "Approve the listing", status: ready, status_since: "2026-03-01T10:00:00+00:00", role: owner, owner_id: ceo}
    - id: T-7
      title: "Publish the listing"
      status: blocked
      status_since: "2026-03-03T14:00:00+00:00"
      role: developer
      owner_id: agent-dev-1
      block: {reason: "parked until the listing is approved", since: "2026-03-03T14:00:00+00:00"}
    # Look-alike: parked on H-7 too, but also waiting for a PR to merge.
    - id: T-8
      title: "Announce the listing"
      status: blocked
      status_since: "2026-03-03T14:00:00+00:00"
      role: developer
      owner_id: agent-dev-1
      block: {reason: "waiting for the listing and the merge of #9", since: "2026-03-03T14:00:00+00:00"}
    # S9: the person's own task is blocked, with agent work behind it: an item of their digest.
    - id: H-9
      title: "Sign the vendor contract"
      status: blocked
      status_since: "2026-03-03T14:00:00+00:00"
      role: owner
      owner_id: ceo
      block: {reason: "waiting for the vendor's signature", since: "2026-03-03T14:00:00+00:00"}
    - {id: T-9, title: "Integrate the vendor API", status: backlog, status_since: "2026-03-03T14:00:00+00:00", role: developer}
    # Look-alike: the person's blocked task with nothing behind it is in no digest.
    - id: H-10
      title: "Renew the domain"
      status: blocked
      status_since: "2026-03-03T14:00:00+00:00"
      role: owner
      owner_id: ceo
      block: {reason: "waiting for the registrar", since: "2026-03-03T14:00:00+00:00"}
  dependencies:
    - {task_id: T-9, depends_on: H-9}
  conditions:
    - {id: "human:T-7:H-7", kind: human_task, task_id: T-7, params: {task: H-7}, satisfied: false, checked_at: "2026-03-04T09:58:00+00:00", registered_at: "2026-03-03T14:00:00+00:00"}
    - {id: "human:T-8:H-7", kind: human_task, task_id: T-8, params: {task: H-7}, satisfied: false, checked_at: "2026-03-04T09:58:00+00:00", registered_at: "2026-03-03T14:00:00+00:00"}
    - {id: "pr:T-8:9", kind: pr_merged, task_id: T-8, params: {repo: example/app, pr: 9}, satisfied: false, checked_at: "2026-03-04T09:58:00+00:00", registered_at: "2026-03-03T14:00:00+00:00"}
expected_actions:
  - {kind: alert, task_id: T-8, reason_contains: "limit 8h"}
  - {kind: alert, task_id: H-10, reason_contains: "has no condition Kelpie can check"}
not_expected_actions:
  - {kind: alert, task_id: T-7}
  - {kind: alert, task_id: H-9}
