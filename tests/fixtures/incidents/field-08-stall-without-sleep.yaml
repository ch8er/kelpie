id: "field-08-stall-without-sleep"
incident: null
title: "A real 47-minute stall without a clock jump alerts as today"
description: >
  The negative case of host sleep: the same farm and the same silent session, but the host
  never slept (no `host_sleeps`): the clocks ran together, so the 49 minutes since the
  session's last heartbeat are 49 minutes of a farm that could have worked. It is past the
  stale bar and is requeued as on any day, without a word about sleep; so is the review
  session that ended without a status 53 minutes ago. The session that is beating is left
  alone.
rule: exit_contract
config:
  session_exit_grace: "10m"
  session_stale_after: "30m"
