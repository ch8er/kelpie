id: "01-guard-block-after-new-push"
incident: 1
title: "A fresh guard block is not cleared by stale 'green' data"
description: >
  The negative side of incident 1. CI was green for the previous commit; the agent pushed a
  fix and set a new guard block "wait for CI". The connector has not polled since the push,
  so the condition still reads satisfied with data from before the block. Clearing the block
  now would skip CI for the new commit. Likewise, a condition whose connector stopped polling
  hours ago is not evidence; it gets an alert instead. Only the block whose condition was re-checked after it was set,
  and recently, is cleared.
rule: stale_blocks
config:
  unblock_grace: "5m"
  max_condition_age: "15m"
snapshot:
  now: "2026-03-02T14:00:00+00:00"
  owners:
    - {id: agent-dev-1, role: developer}
  tasks:
    # New push one minute ago; the condition data predates the block.
    - id: T-111
      title: "Fix date parsing"
      status: blocked
      status_since: "2026-03-02T13:59:00+00:00"
      owner_id: agent-dev-1
      block: {reason: "guard: wait for CI on example/repo#51", since: "2026-03-02T13:59:00+00:00", condition_id: C-111}
    # Connector stopped polling three hours ago.
    - id: T-112
      title: "Rename config keys"
      status: blocked
      status_since: "2026-03-02T10:00:00+00:00"
      owner_id: agent-dev-1
      block: {reason: "guard: wait for CI on example/repo#52", since: "2026-03-02T10:00:00+00:00", condition_id: C-112}
    # Re-checked after the block and recently: stale, clear it.
    - id: T-113
      title: "Speed up import"
      status: blocked
      status_since: "2026-03-02T12:00:00+00:00"
      owner_id: agent-dev-1
      block: {reason: "guard: wait for CI on example/repo#53", since: "2026-03-02T12:00:00+00:00", condition_id: C-113}
  conditions:
    - {id: C-111, kind: ci_status, task_id: T-111, params: {repo: example/repo, pr: 51}, satisfied: true, satisfied_at: "2026-03-02T11:58:00+00:00", checked_at: "2026-03-02T12:30:00+00:00"}
    - {id: C-112, kind: ci_status, task_id: T-112, params: {repo: example/repo, pr: 52}, satisfied: true, satisfied_at: "2026-03-02T10:30:00+00:00", checked_at: "2026-03-02T11:00:00+00:00"}
    - {id: C-113, kind: ci_status, task_id: T-113, params: {repo: example/repo, pr: 53}, satisfied: true, satisfied_at: "2026-03-02T12:40:00+00:00", checked_at: "2026-03-02T13:58:00+00:00"}
expected_actions:
  - kind: alert
    task_id: T-112
    reason_contains: "is the connector running"
  - kind: unblock
    task_id: T-113
    reason_contains: "outlived its cause by 1h 20m"
not_expected_actions:
  - {kind: unblock, task_id: T-111}
  - {kind: unblock, task_id: T-112}
