id: "08-delegate-closed-still-broken"
incident: 8
title: "Delegation: the agent closes its card but the block stays, and the person is told"
description: >
  ops-1 closed its card about T-861 an hour ago, yet stale_blocks still reports the block:
  the agent's word is not the fix. On its first attempt the person hears "agent says fixed,
  still broken" and the problem goes to the operator once more. On T-862 it was the second
  attempt, so it goes back to the person ("not fixed, yours now"). T-863's card was closed
  only ten minutes ago, inside the hold, so Kelpie waits for its own check to catch up.
rule: delegation
