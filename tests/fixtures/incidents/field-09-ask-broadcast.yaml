  - {kind: alert, task_id: T-911, params: {recipient: agent-dev-4}}
  - {kind: alert, task_id: T-911, params: {recipient: agent-dev-5}}
  - {kind: alert, task_id: T-911, params: {recipient: agent-dev-6}}
  - {kind: alert, task_id: T-911, params: {recipient: agent-dev-7}}
