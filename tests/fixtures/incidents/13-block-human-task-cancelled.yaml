id: "13-block-human-task-cancelled"
incident: 13
title: "Agent blocked on a human's task that was cancelled"
description: >
  The coder blocked its card on "waiting_human: approval in T-44", and the human cancelled
  T-44 instead of doing it. The human_task condition can never be met (only done satisfies
  it; the connector flags cancelled and failed tasks terminal), so rule 4 alerts at once
  instead of after the 8h "condition unmet" limit. A card whose human task is still open is
  left waiting.
rule: stale_blocks
config:
  unblock_grace: "5m"
  max_condition_age: "15m"
  max_block: "8h"
snapshot:
  now: "2026-03-02T14:00:00+00:00"
  owners:
    - {id: coder-1, role: coder}
    - {id: owner-1, role: owner, kind: human}
  tasks:
    - id: T-1311
      title: "Rotate the deploy credentials"
      status: blocked
      status_since: "2026-03-02T13:00:00+00:00"
      role: coder
      owner_id: coder-1
      block:
        reason: "waiting_human: approval in T-44"
        since: "2026-03-02T13:00:00+00:00"
        condition_id: "block:T-1311:human_task:T-44"
    # Distractor: its human task is still open.
    - id: T-1312
      title: "Open the service port"
      status: blocked
      status_since: "2026-03-02T13:00:00+00:00"
      role: coder
      owner_id: coder-1
      block:
        reason: "waiting_human: approval in T-45"
        since: "2026-03-02T13:00:00+00:00"
        condition_id: "block:T-1312:human_task:T-45"
    - id: T-44
      title: "Approve credential rotation"
      status: cancelled
      status_since: "2026-03-02T13:30:00+00:00"
      owner_id: owner-1
    - id: T-45
      title: "Approve port change"
      status: review
      status_since: "2026-03-02T13:10:00+00:00"
      owner_id: owner-1
  conditions:
    - id: "block:T-1311:human_task:T-44"
      kind: human_task
      task_id: T-1311
      params: {task: T-44, source: block_reason, status: cancelled, owner: owner-1, terminal: true}
      satisfied: false
      checked_at: "2026-03-02T13:59:00+00:00"
      registered_at: "2026-03-02T13:00:00+00:00"
    - id: "block:T-1312:human_task:T-45"
      kind: human_task
      task_id: T-1312
      params: {task: T-45, source: block_reason, status: review, owner: owner-1}
      satisfied: false
      checked_at: "2026-03-02T13:59:00+00:00"
      registered_at: "2026-03-02T13:00:00+00:00"
expected_actions:
  - kind: alert
    task_id: T-1311
    reason_contains: "ended as cancelled"
not_expected_actions:
  - kind: alert
    task_id: T-1312
  - kind: unblock
    task_id: T-1311
