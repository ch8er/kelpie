          created_at: "2026-10-18T12:00:00+00:00", source: cli, behind_at_snooze: 2}
    H-3: {task_id: H-3, until: "2026-10-26T00:00:00+00:00", reason: "after the release", by: ceo,
          created_at: "2026-10-18T12:00:00+00:00", source: cli, behind_at_snooze: 1}
