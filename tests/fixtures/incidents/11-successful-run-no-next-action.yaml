id: "11-successful-run-no-next-action"
incident: 11
title: "A successful run with no next action"
description: >
  A run ended declaring its task done, but the board never applied it: the task stayed in
  progress with nobody on it, so its result sat unused. Elsewhere a task finished done and
  the two tasks waiting for it stayed in backlog with every parent finished, because nothing
  promoted them to ready. A run that ended a few minutes ago, a run that ended without a
  status (rule 1's), a handed-on review, a parent still in progress and dependents that were
  woken are left alone.
rule: orphan_status
config:
  next_action_after: "30m"
  review_idle_after: "2h"
  critical_dependents: 3
snapshot:
  now: "2026-03-02T16:00:00+00:00"
  owners:
    - {id: agent-dev-1, role: developer}
    - {id: agent-dev-2, role: developer}
    - {id: reviewer-1, role: reviewer}
  tasks:
    # Its run declared done an hour ago; the task is still in progress.
    - {id: T-1141, title: "Add retries to the client", status: in_progress, status_since: "2026-03-02T13:00:00+00:00", role: developer, owner_id: agent-dev-1}
    # Declared done 15 minutes ago: the platform may still apply it.
    - {id: T-1142, title: "Rename config keys", status: in_progress, status_since: "2026-03-02T15:00:00+00:00", role: developer, owner_id: agent-dev-2}
    # Finished; its dependents were never promoted.
    - {id: T-1140, title: "Define schema", status: done, status_since: "2026-03-02T10:00:00+00:00", role: developer, owner_id: agent-dev-1}
    - {id: T-1143, title: "Write migration", status: done, status_since: "2026-03-02T15:00:00+00:00", role: developer, owner_id: agent-dev-1}
    - {id: T-1144, title: "Backfill data", status: backlog, status_since: "2026-03-02T09:00:00+00:00", role: developer}
    - {id: T-1145, title: "Drop old columns", status: backlog, status_since: "2026-03-02T09:00:00+00:00", role: developer}
    # Its parent is still being worked on.
    - {id: T-1146, title: "Update API docs", status: backlog, status_since: "2026-03-02T09:00:00+00:00", role: developer}
    - {id: T-1147, title: "New endpoint", status: in_progress, status_since: "2026-03-02T14:00:00+00:00", role: developer, owner_id: agent-dev-2}
    # Its run ended without a final status: rule 1 requeues it.
    - {id: T-1148, title: "Fix flaky test", status: in_progress, status_since: "2026-03-02T12:00:00+00:00", role: developer, owner_id: agent-dev-1}
    # Handed on to review during its run, as declared.
    - {id: T-1149, title: "Cache warmup", status: review, status_since: "2026-03-02T14:30:00+00:00", role: developer, owner_id: agent-dev-1}
    # Finished; its dependent was promoted to ready.
    - {id: T-1150, title: "Add metrics", status: done, status_since: "2026-03-02T15:10:00+00:00", role: developer, owner_id: agent-dev-2}
    - {id: T-1151, title: "Dashboard panel", status: ready, status_since: "2026-03-02T15:12:00+00:00", role: developer}
  dependencies:
    - {task_id: T-1144, depends_on: T-1140}
    - {task_id: T-1144, depends_on: T-1143}
    - {task_id: T-1145, depends_on: T-1143}
    - {task_id: T-1146, depends_on: T-1147}
    - {task_id: T-1151, depends_on: T-1150}
  sessions:
    - {id: S-1141, task_id: T-1141, owner_id: agent-dev-1, started_at: "2026-03-02T13:00:00+00:00", ended_at: "2026-03-02T15:00:00+00:00", final_status: done}
    - {id: S-1142, task_id: T-1142, owner_id: agent-dev-2, started_at: "2026-03-02T15:00:00+00:00", ended_at: "2026-03-02T15:45:00+00:00", final_status: done}
    - {id: S-1143, task_id: T-1143, owner_id: agent-dev-1, started_at: "2026-03-02T13:30:00+00:00", ended_at: "2026-03-02T15:00:00+00:00", final_status: done}
    - {id: S-1147, task_id: T-1147, owner_id: agent-dev-2, started_at: "2026-03-02T15:50:00+00:00", last_heartbeat: "2026-03-02T15:59:00+00:00"}
    - {id: S-1148, task_id: T-1148, owner_id: agent-dev-1, started_at: "2026-03-02T12:00:00+00:00", ended_at: "2026-03-02T14:00:00+00:00"}
    - {id: S-1149, task_id: T-1149, owner_id: agent-dev-1, started_at: "2026-03-02T13:00:00+00:00", ended_at: "2026-03-02T14:30:00+00:00", final_status: review}
expected_actions:
  - kind: alert
    task_id: T-1141
    reason_contains: "declaring 'done'"
    params: {pattern: no-next-action, declared: done, session_id: S-1141}
  - kind: alert
    task_id: T-1143
    reason_contains: "Nothing promoted them to ready"
    params: {pattern: dependents-not-woken, dependent_ids: [T-1144, T-1145]}
not_expected_actions:
  - {kind: alert, task_id: T-1142}
  - {kind: alert, task_id: T-1140}
  - {kind: alert, task_id: T-1146}
  - {kind: alert, task_id: T-1147}
  - {kind: alert, task_id: T-1148}
  - {kind: alert, task_id: T-1149}
  - {kind: alert, task_id: T-1150}
  - {kind: alert, task_id: T-1151}
