id: "field-07-runaway-context"
incident: null
title: "A session's context grows past 150k tokens and is re-read on every step"
description: >
  Field evidence from a live farm (synthetic reconstruction, issue #197). Ten to thirteen
  sessions a day grew to 160k-433k tokens of context, a few thousand more per step, and
  every model call re-read all of it: 30-80M re-read tokens a day, even in sessions that
  made progress. The daily report showed it a day late; rule 11 now alerts per session,
  with the context, the growth per step and the tokens re-read, and recommends compacting
  or a bounded session. A session that compacted below the threshold, and one with too few
  steps to tell, are left alone.
rule: no_progress
config:
  window: "30m"
  context_alert_tokens: 150000
  context_min_steps: 5
