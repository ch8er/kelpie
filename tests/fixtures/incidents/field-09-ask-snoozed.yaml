id: "field-09-ask-snoozed"
incident: null
title: "A snoozed ask stays silent until its date; an expired snooze reminds again"
description: >
  A person snoozed the reminder about a developer's question to the architect until the
  architecture review on Thursday: Kelpie stays silent about it until then, though the
  architect is idle. Another question whose snooze ended yesterday is reminded again, and
  the reminder says the snooze expired.
