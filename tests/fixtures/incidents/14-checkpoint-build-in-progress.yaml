id: "14-checkpoint-build-in-progress"
incident: null
title: "No commit reminder while a build or simulator run is in progress"
description: >
  From a live review (rule 9 on Hermes): an agent running xcodebuild or ios_sim.sh from its
  task worktree is busy, and a "no commit" reminder interrupts it for nothing. The Hermes
  adapter reads such a process from the host ([adapters.hermes.tools]) as the session's
  running_tool, from its start; this is the rule's side. A session whose build started 3
  minutes ago is not reminded; one with the same uncommitted work and no tool running is;
  so is one whose build has run past tool_grace (it may be hung).
rule: checkpoints
config:
  commit_every: "30m"
  tool_grace: "2h"
