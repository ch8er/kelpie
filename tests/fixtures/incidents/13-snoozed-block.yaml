id: "13-snoozed-block"
incident: 13
title: "A snoozed block gets no reminders, but its facts still alert"
description: >
  Without the needs-you inbox rule 4 alerts on every block it cannot clear. A person
  snoozed four of them until the release. The no-condition reminder on the R2 question
  and the overdue reminder on the merge wait are held: the person knows. The marker
  snooze an agent wrote into a block reason holds its no-condition reminder the same way.
  Facts are not reminders: a block whose PR was closed without merging (a dead end) and a
  block whose condition the connector stopped checking still alert, snoozed or not. A
  block whose snooze expired two days ago alerts again and says so; an unsnoozed block
  alerts as before.
rule: stale_blocks
config:
  needs_you: false
  unlinked_alert_after: "4h"
  max_block: "8h"
  stale_evidence_after: "1h"
