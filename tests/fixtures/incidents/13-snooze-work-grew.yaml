id: "13-snooze-work-grew"
incident: 13
title: "A snoozed wait comes back when more work is blocked behind it"
description: >
  The CEO snoozed their own task (sign the vendor contract) until the release, when one
  agent task waited on it. Since then two more agent tasks were planned behind it and now
  wait too: the deferral costs more than the CEO agreed to, so the task is back in the
  digest, marked with how many more tasks are blocked since the snooze. The distractors
  keep their snoozes: the security review, with as much work behind it as when it was
  snoozed, and the data export, snoozed by an until: marker, which does not know how much
  work was behind it and so never comes back on growth.
rule: needs_you
config:
  human_wait_alert_after: "1h"
snapshot:
  now: "2026-10-19T10:00:00+00:00"
  owners:
    - {id: ceo, role: owner, kind: human}
    - {id: agent-dev-1, role: developer}
