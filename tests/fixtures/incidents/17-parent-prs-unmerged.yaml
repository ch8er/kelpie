id: "17-parent-prs-unmerged"
incident: 17
title: "A parent whose subtasks are done but whose PRs are not merged stays open"
description: >
  From a live 24 h review in observe mode: every subtask of a parent was done on the board,
  but two of their PRs had been returned for conflicts and were not merged, and Kelpie still
  proposed closing the parent. Closing it would have dropped work that never landed. A
  parent is proposed for closing only when the code host's open and recently closed PRs are
  known and every PR linked to the parent or a subtask (by task code in its title or branch)
  is merged, each subtask with a merged PR of its own. Here APP-040's subtask APP-051a has
  an open PR with conflicts (the parent is not finished at all), and APP-051b's PR was closed
  without merging; APP-080's only subtask PR was closed without merging, so Kelpie names the
  unmerged PR and proposes nothing; APP-060, whose subtasks' PRs are all merged, is asked to
  close.
rule: orphan_status
config: {}
snapshot:
  now: "2026-03-02T18:00:00+00:00"
  owners:
    - {id: agent-orch-1, role: orchestrator}
    - {id: agent-dev-1, role: developer}
  tasks:
    # The farm case: subtasks done, their PRs returned for conflicts.
    - {id: t_a040, title: "APP-040 Sign-in flow", status: ready, status_since: "2026-03-02T12:00:00+00:00", role: orchestrator, assignee: agent-orch-1, subtasks: [t_a051a, t_a051b]}
    - {id: t_a051a, title: "APP-051a Sign-in screen", status: done, status_since: "2026-03-02T10:00:00+00:00", role: developer, branch: "app/APP-051a"}
    - {id: t_a051b, title: "APP-051b Session refresh", status: done, status_since: "2026-03-02T11:00:00+00:00", role: developer, branch: "app/APP-051b"}
    # A parent whose work did land.
    - {id: t_a060, title: "APP-060 Settings", status: ready, status_since: "2026-03-02T12:00:00+00:00", role: orchestrator, assignee: agent-orch-1, subtasks: [t_a061, t_a062]}
    - {id: t_a061, title: "APP-061 Settings list", status: done, status_since: "2026-03-02T10:00:00+00:00", role: developer, branch: "app/APP-061"}
    - {id: t_a062, title: "APP-062 Settings sync", status: done, status_since: "2026-03-02T11:00:00+00:00", role: developer, branch: "app/APP-062"}
    # Subtask done, its PR returned and closed without merging.
