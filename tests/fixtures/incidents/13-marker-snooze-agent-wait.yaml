id: "13-marker-snooze-agent-wait"
incident: 13
title: "A marker snooze holds only a wait on a person"
description: >
  An until: marker is an agent's words, trusted only as a record of a person's decision.
  Two agents wrote one on waits of their own: one waits for CI on its PR, the other parked
  itself because its tests were flaky. Neither waits on a person, so rule 4 keeps their
  overdue and no-condition alerts, marker or not. The distractors are marker snoozes on
  real human waits: a block that asks the CEO, and a block that waits only on a person's
  human task. Rule 4 holds their reminders.
rule: stale_blocks
config:
  needs_you: false
  unlinked_alert_after: "4h"
  max_block: "8h"
snapshot:
  now: "2026-10-19T20:00:00+00:00"
  owners:
