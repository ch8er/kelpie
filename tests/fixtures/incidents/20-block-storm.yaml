id: "20-block-storm"
incident: 20
title: "Seven agents blocked on the same question within the hour: one outage, not seven waits"
description: >
  The toolchain on the farm's macOS host broke. Within the hour seven agents blocked their
  tasks on nearly the same words, "waiting for CEO (Xcode first launch)", differing only in
  case, spacing and the task ids they added. Kelpie saw seven independent waits on a person
  and counted them seven times. Rule 4 must see one outage with its start, its scope (the
  seven tasks), its cause and the person who can end it, while three tasks waiting on the
  same person for different reasons, and six tasks each waiting on its own PR's CI, stay
  separate waits.
rule: stale_blocks
config:
  storm_min_tasks: 5
  storm_window: "2h"
snapshot:
  now: "2026-03-02T11:00:00+00:00"
  owners:
    - {id: ceo, role: ceo, kind: human}
    - {id: agent-ios-1, role: developer}
    - {id: agent-ios-2, role: developer}
    - {id: agent-ios-3, role: developer}
    - {id: agent-web-1, role: developer}
    - {id: agent-api-1, role: developer}
  tasks:
    - {id: t_5a0c2e70, title: "iOS task 1", status: blocked, status_since: "2026-03-02T10:00:00+00:00", owner_id: agent-ios-1, block: {reason: "needs_input: waiting for CEO (Xcode first launch)", since: "2026-03-02T10:00:00+00:00"}}
