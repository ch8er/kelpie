expected_actions:
  - kind: alert
    severity: warning
    reason_contains: "Block storm since 2026-03-02 10:00 UTC: 7 tasks blocked within 52 min"
    params:
      kind: block_storm
      person: ceo
      signature: "needs_input: waiting for CEO (Xcode first launch)"
      tasks: [t_5a0c2e70, t_5a0c2e71, t_5a0c2e72, t_5a0c2e73, t_5a0c2e74, t_5a0c2e75, t_5a0c2e76]
not_expected_actions:
  # The same person, different questions: three waits, not a storm.
  - kind: alert
    reason_contains: "pricing"
  - kind: alert
    reason_contains: "release date"
  # Each task waits on its own PR's CI, which Kelpie checks: not a storm.
  - kind: alert
    reason_contains: "CI on"
