id: "16-human-task-gates-chain"
incident: 16
title: "A human task gates a chain of 28 agent tasks"
description: >
  An agent task was linked to a human task (store the products in the app store console).
  28 agent tasks depended on it through a chain, and the ready queue held only human
  tasks, so the farm ran 3 of 5 slots and closed about 4 tasks an hour instead of 9.
  Kelpie must show the cost of the dependency (the agent work behind the human task and
  the idle capacity) and leave the dependency itself to a human.
rule: bottlenecks
config:
  min_idle_time: "30m"
  human_gate_min_tasks: 3
  human_gate_after: "1h"
  slots: 5
