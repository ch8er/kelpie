id: "13-person-block-inbox-off"
incident: 13
title: "Without the needs-you inbox, rule 4 still alerts on a person's block"
description: >
  The hand-off of 13-person-block-left-to-inbox holds only while rule 13 reaches people.
  When it does not (it is not loaded, or it runs in observe while rule 4 alerts: needs_you
  is false), rule 4 alerts on a 'waiting_human: needs_input' block with no condition after
  unlinked_alert_after as before, so nothing goes silent. A younger block is not alerted on
  yet.
