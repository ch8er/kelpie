# #374: the hook/OTLP pairing across ingest tokens ("hook fold"). agent-dev-2's run S-102
# loops: eight identical shell calls, recorded by the platform's hook (verified). agent-dev-1
# sends OTLP tool spans in its own session S-101, under its own token, carrying the same
# (provider-generated) call ids. Paired by call id regardless of the token, each hook span
# folded into a dev-1 span moved to S-102; the scope check judged those out of scope and
# deleted them, and rule 10 missed the loop. Now a span pairs with a hook span only when its
# token may report the folded span: the hook calls stay, and rule 10 stops S-102.
# Read by tests/traces/test_hook_fold_tokens.py.
id: m1-hook-fold-across-tokens
description: >
  Another token's spans carrying a looping run's call ids no longer fold its verified hook
  calls away: rule 10 stops S-102; dev-1's own spans stay in S-101 and stop nothing.
config:
  tokens:
    - {name: dev-1, owners: [agent-dev-1]}
    - {name: dev-2, roles: [developer-b]}
snapshot:
  now: "2026-03-02T12:00:00+00:00"
  owners:
