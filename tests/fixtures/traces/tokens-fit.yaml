id: "tokens-fit"
incident: null
title: "Repeated fragments, unused tools, model fit and whole-PR re-review"
description: >
  Synthetic farm day. Every developer session reads the same 20k-token contributing guide;
  the developer platform lists the tools it offers, three of which are never called. A
  triage agent polls on the large model with short answers all day (a cheaper-model
  candidate; the farm runs the small model, the tiny one is only priced). A writer role
  moved to the small model yesterday and its tasks have come back more often since (the
  switch is flagged and no further downgrade is suggested). A reviewer re-reads the whole PR
  in round 2. Distractors: `git status` outputs that differ each time, the same `pytest` run
  in every session (a command, not a read), a file read in only two sessions, a reviewer
  with long answers, a shared agents file every review reads, and a round 2 that reads only
  a new file.
