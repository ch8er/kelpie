  prices:
    model-large: {input: 3.0, output: 15.0, cached_input: 0.3}
    model-small: {input: 0.25, output: 1.25, cached_input: 0.025}
    model-tiny: {input: 0.1, output: 0.4, cached_input: 0.01}
